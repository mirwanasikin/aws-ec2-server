name: CI check

on:
  pull_request:
    branches:
      - main

jobs:
  tofu-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Opentofu
        uses: opentofu/setup-opentofu@v1

      - name: Tofu Format Check
        working-directory: tofu/environment/server
        run: tofu fmt --check

      - name: Tofu validate
        working-directory: tofu/environment/server
        run: |
          tofu init -backend=false
          tofu validate

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-lint

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible lint
        working-directory: ansible
        run: ansible-lint

  checkov:
    runs-on: ubuntu-latest
    needs: [tofu-check, ansible-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install checkov

      - name: Run checkov on OpenTofu
        run: checkov -d tofu/ --framework terraform --skip-check CKV_AWS_xxx

      - name: Run checkov on Ansible
        run: checkov -d ansible/ --framework ansible
